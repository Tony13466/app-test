{% extends "base.html" %}

{% block title %} Login {% endblock %}

{% block content %}

<h1>Iniciar sesión</h1>

<form method="POST">
    <label for="correo">
        Correo electrónico
    </label>

    <br>

    <input
        type="email"
        id="correo"
        name="correo"
    >

    <br><br>

    <label for="password">
        Contraseña
    </label>

    <br>

    <input
        type="password"
        id="password"
        name="password"
    >

    <br><br>

    <button type="submit">
        Ingresar
    </button>

</form>

{% endblock %}
