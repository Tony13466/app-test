{% extends "base.html" %}

{% block title %} Registro {% endblock %}

{% block content %}

<h1>Crear Cuenta</h1>

<form method="POST">

    <label for="correo">
        Correo Electrónico
    </label>

    <br>

    <input type="email"
           id="correo"
           name="correo"
           required
    >

    <br><br>

    <label for="password">
        Contraseña
    </label>

    <br>

    <input type="password"
           id="password"
           name="password"
           required
    >

    <br><br>

    <button type="submit">
        Registrarme
    </button>
</form>

{% endblock %}
